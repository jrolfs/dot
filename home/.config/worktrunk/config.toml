# # User Configuration
#
# Create with `wt config create`.
#
# Location:
#
# - macOS/Linux: `~/.config/worktrunk/config.toml` (or `$XDG_CONFIG_HOME` if set)
# - Windows: `%APPDATA%\worktrunk\config.toml`
#
# ## Worktree path template
#
# Controls where new worktrees are created.
#
# **Variables:**
#
# - `{{ repo_path }}` — absolute path to the repository (e.g., `/Users/me/code/myproject`)
# - `{{ repo }}` — repository directory name (e.g., `myproject`)
# - `{{ branch }}` — raw branch name (e.g., `feature/auth`)
# - `{{ branch | sanitize }}` — filesystem-safe: `/` and `\` become `-` (e.g., `feature-auth`)
# - `{{ branch | sanitize_db }}` — database-safe: lowercase, underscores, hash suffix (e.g., `feature_auth_x7k`)
#
# **Examples** for repo at `~/code/myproject`, branch `feature/auth`:
#
# # Default — sibling directory
# # Creates: ~/code/myproject.feature-auth
# # worktree-path = "{{ repo_path }}/../{{ repo }}.{{ branch | sanitize }}"
#
# # Inside the repository
# # Creates: ~/code/myproject/.worktrees/feature-auth
# worktree-path = "{{ repo_path }}/.worktrees/{{ branch | sanitize }}"
#
# # Centralized worktrees directory
# # Creates: ~/worktrees/myproject/feature-auth
# worktree-path = "~/worktrees/{{ repo }}/{{ branch | sanitize }}"
#
# `~` expands to the home directory. Relative paths are relative to the repository root.
#
# ## LLM commit messages
#
# Generate commit messages automatically during merge. Requires an external CLI tool.
#
# ### Claude Code
#
# # [commit.generation]
# # command = "CLAUDECODE= MAX_THINKING_TOKENS=0 claude -p --no-session-persistence --model=haiku --tools='' --disable-slash-commands --setting-sources='' --system-prompt=''"
#
# ### Codex
#
# # [commit.generation]
# # command = "codex exec -m gpt-5.1-codex-mini -c model_reasoning_effort='low' -c system_prompt='' --sandbox=read-only --json - | jq -sr '[.[] | select(.item.type? == \"agent_message\")] | last.item.text'"
#
# ### opencode
#
# # [commit.generation]
# # command = "opencode run -m anthropic/claude-haiku-4.5 --variant fast"
#
# ### llm
#
# # [commit.generation]
# # command = "llm -m claude-haiku-4.5"
#
# ### aichat
#
# # [commit.generation]
# # command = "aichat -m claude:claude-haiku-4.5"
#
# See LLM commits docs (https://worktrunk.dev/llm-commits/) for setup and Custom prompt templates (#custom-prompt-templates) for template customization.
#
# ## Step config

[step.copy-ignored]
exclude = ["node_modules/"]

# ## Command config
#
# ### List
#
# Persistent flag values for `wt list`. Override on command line as needed.
#
# [list]
# summary = false    # Enable LLM branch summaries (requires [commit.generation])
#
# full = false       # Show CI, main…± diffstat, and LLM summaries (--full)
# branches = false   # Include branches without worktrees (--branches)
# remotes = false    # Include remote-only branches (--remotes)
#
# task-timeout-ms = 0   # Kill individual git commands after N ms; 0 disables
# timeout-ms = 0        # Wall-clock budget for the entire collect phase; 0 disables
#
# ### Commit
#
# Shared by `wt step commit`, `wt step squash`, and `wt merge`.
#
# [commit]
# stage = "all"      # What to stage before commit: "all", "tracked", or "none"
#
# ### Merge
#
# Most flags are on by default. Set to false to change default behavior.
#
# [merge]
# squash = true      # Squash commits into one (--no-squash to preserve history)
# commit = true      # Commit uncommitted changes first (--no-commit to skip)
# rebase = true      # Rebase onto target before merge (--no-rebase to skip)
# remove = true      # Remove worktree after merge (--no-remove to keep)
# verify = true      # Run project hooks (--no-verify to skip)
# no-ff = false      # Create a merge commit even when fast-forward is possible (--no-ff)
#
# ### Switch
#
# [switch]
# no-cd = true       # Skip directory change after switching (--cd to override)
#
# [switch.picker]
# # Pager command for diff preview (overrides git's core.pager)
# # pager = "delta --paging=never"
#
# # Wall-clock budget (ms) for picker data collection (default: 500)
# # Tasks still running when the budget expires are abandoned; 0 disables
# # timeout-ms = 500
#
# ### Aliases
#
# Command templates that run with `wt step <name>`. See `wt step` aliases (https://worktrunk.dev/step/#aliases) for usage and flags.
#
# [aliases]
# greet = "echo Hello from {{ branch }}"
# url = "echo http://localhost:{{ branch | hash_port }}"
#
# Aliases defined here apply to all projects. For project-specific aliases, use the project config (https://worktrunk.dev/config/#project-configuration) `[aliases]` section instead.
#
# ### User project-specific settings
#
# For context:
#
# - Project config (https://worktrunk.dev/config/#project-configuration) settings are shared with teammates.
# - User configs generally apply to all projects.
# - User configs _also_ has a `[projects]` table which holds project-specific settings for the user, such as worktree layout and setting overrides. That's what this section covers.
#
# Entries are keyed by project identifier (e.g., `github.com/user/repo`).
#
# #### Setting overrides [experimental]
#
# Override global user config for a specific project. Scalar values (like `worktree-path`) replace the global value. Hooks append — both global and per-project hooks run. Aliases merge — per-project aliases override global aliases on name collision.
#
# [projects."github.com/user/repo"]
# worktree-path = ".worktrees/{{ branch | sanitize }}"
# list.full = true
# merge.squash = false
# post-create.env = "cp .env.example .env"
# aliases.deploy = "make deploy BRANCH={{ branch }}"
#
# ### Custom prompt templates
#
# Templates use minijinja (https://docs.rs/minijinja/) syntax.
#
# #### Commit template
#
# Available variables:
#
# - `{{ git_diff }}`, `{{ git_diff_stat }}` — diff content
# - `{{ branch }}`, `{{ repo }}` — context
# - `{{ recent_commits }}` — recent commit messages
#
# Default template:
#
# <!-- DEFAULT_TEMPLATE_START -->
# [commit.generation]
# template = """
# Write a commit message for the staged changes below.
#
# <format>
# - Subject line under 50 chars
# - For material changes, add a blank line then a body paragraph explaining the change
# - Output only the commit message, no quotes or code blocks
# </format>
#
# <style>
# - Imperative mood: "Add feature" not "Added feature"
# - Match recent commit style (conventional commits if used)
# - Describe the change, not the intent or benefit
# </style>
#
# <diffstat>
# {{ git_diff_stat }}
# </diffstat>
#
# <diff>
# {{ git_diff }}
# </diff>
#
# <context>
# Branch: {{ branch }}
# {% if recent_commits %}<recent_commits>
# {% for commit in recent_commits %}- {{ commit }}
# {% endfor %}</recent_commits>{% endif %}
# </context>
#
# """
# <!-- DEFAULT_TEMPLATE_END -->
#
# #### Squash template
#
# Available variables (in addition to commit template variables):
#
# - `{{ commits }}` — list of commits being squashed
# - `{{ target_branch }}` — merge target branch
#
# Default template:
#
# <!-- DEFAULT_SQUASH_TEMPLATE_START -->
# [commit.generation]
# squash-template = """
# Combine these commits into a single commit message.
#
# <format>
# - Subject line under 50 chars
# - For material changes, add a blank line then a body paragraph explaining the change
# - Output only the commit message, no quotes or code blocks
# </format>
#
# <style>
# - Imperative mood: "Add feature" not "Added feature"
# - Match the style of commits being squashed (conventional commits if used)
# - Describe the change, not the intent or benefit
# </style>
#
# <commits branch="{{ branch }}" target="{{ target_branch }}">
# {% for commit in commits %}- {{ commit }}
# {% endfor %}</commits>
#
# <diffstat>
# {{ git_diff_stat }}
# </diffstat>
#
# <diff>
# {{ git_diff }}
# </diff>
#
# """
# <!-- DEFAULT_SQUASH_TEMPLATE_END -->

[pre-start]
copy = "wt step copy-ignored"

[projects."github.com/meterup/frontends"]
post-start.direnv = "direnv allow && direnv exec . true"
post-start.deps = "pnpm install"

[projects."github.com/meterup/api"]
post-start.direnv = "direnv allow && direnv exec . true"

# Appended to the global excludes above, not a replacement.
step.copy-ignored.exclude = [
  # 2.4G / 31k files of devenv service state (postgres, clickhouse, kafka, redis)
  # plus gcroot and run-dir symlinks pointing back at the source worktree.
  ".devenv/",
  # Nix profile gcroot only — `source_url` caches in ~/.cache/direnv/cas and the
  # allow token is keyed per path, so there's nothing here worth carrying over.
  ".direnv/",
  # air's rebuilt binary (369M) and its build log.
  "tmp/",
]

# [projects."github.com/meterup/frontends".post-start]
# direnv = "direnv allow"
# deps = "pnpm install"

# Fork of raycast/extensions. Sparse-checkout monorepo of ~2,800 independent
# npm projects under extensions/, blobless partial clone, and changes land as
# PRs against upstream rather than merges into local main.
[projects."github.com/jrolfs/extensions"]
# Appended to the global excludes above, not a replacement.
step.copy-ignored.exclude = [
  # Nothing gitignored under extensions/ is worth carrying over: node_modules
  # is installed per-extension by post-start, dist/ is `ray build` output, and
  # raycast-env.d.ts is regenerated by `ray develop`.
  #
  # This has to exclude the whole tree rather than name those three. An
  # extension directory whose every file is gitignored (a stale checkout left
  # behind when the sparse cone moved on) is reported by git as a single
  # collapsed entry, e.g. `!! extensions/windmill-air/`, so a `node_modules/`
  # pattern never gets a chance to match and copy-ignored recurses into it
  # wholesale. That was 292M for one abandoned directory.
  #
  # `extensions/**`, not `extensions/`: a trailing-slash pattern matches only
  # the entry itself, so it never fires on the paths below it.
  "extensions/**",
]

# git copies info/sparse-checkout into new worktrees, so each one starts scoped
# to whatever the previous worktree happened to use. Re-scope from the branch
# name instead: `<ext>/<slug>` and `ext/<ext>/<slug>` both resolve to `<ext>`.
# A branch with no `/` keeps the inherited cone, since there's nothing sensible
# to guess. Blocking so post-start's install finds the directory on disk.
[projects."github.com/jrolfs/extensions".pre-start]
sparse = '''
set -eu
branch={{ branch }}
case $branch in
  */*) ext=${branch#ext/}; ext=${ext%%/*} ;;
  *) exit 0 ;;
esac
git -C {{ worktree_path }} sparse-checkout set "extensions/$ext"
echo "cone: extensions/$ext"
'''

# npm, never pnpm: Raycast CI allows package-lock.json only. Reads the cone
# rather than re-parsing the branch, so a hand-set cone still works.
#
# `npm ci` rather than `npm install`, because install rewrites package-lock.json
# and that lands as an unrelated diff on the one file Raycast CI polices most.
# Fall back to install only when there's no lockfile to honour yet, i.e. a
# brand-new extension.
[projects."github.com/jrolfs/extensions".post-start]
install = '''
set -eu
dir={{ worktree_path }}/$(git -C {{ worktree_path }} sparse-checkout list | grep '^extensions/' | head -1)
[ -f "$dir/package.json" ] || exit 0
if [ -f "$dir/package-lock.json" ]; then
  npm ci --prefix "$dir"
else
  npm install --prefix "$dir"
fi
'''

[projects."github.com/jrolfs/extensions".aliases]
# Sync the fork from raycast/extensions server-side. Deliberately never fetches
# the `upstream` remote: it has no partial-clone filter, so fetching it directly
# backfills blobs for the entire history it pulls.
sync = "gh repo sync jrolfs/extensions -b main && git fetch --quiet origin main"

# Create a worktree at the current upstream tip, e.g.
#   wt ext imessage-2fa/gmail-filter-fix
# Bases on origin/main because `git fetch` doesn't move local main, so the
# default `--base main` would silently be as stale as the last sync.
ext = "gh repo sync jrolfs/extensions -b main && git fetch --quiet origin main && wt switch --create {{ args }} --base origin/main"

# Rebase the worktree you're already in onto the current upstream tip.
up = "gh repo sync jrolfs/extensions -b main && git fetch --quiet origin main && git rebase origin/main"

# The scoped extension directory. Handy as `cd "$(wt dir)"`.
dir = "git sparse-checkout list | grep '^extensions/' | head -1"

dev = "cd $(git sparse-checkout list | grep '^extensions/' | head -1) && npm run dev"
lint = "cd $(git sparse-checkout list | grep '^extensions/' | head -1) && npm run fix-lint"

# Terminal action for this repo. `wt merge` squash-merges into local main, which
# does nothing for a fork whose changes land upstream, so use this instead. It
# gates on the two things Raycast CI rejects most often.
pr = '''
set -eu
ext=$(git sparse-checkout list | grep '^extensions/' | head -1)
grep -q '{PR_MERGE_DATE}' "$ext/CHANGELOG.md" \
  || { echo "✗ $ext/CHANGELOG.md has no {PR_MERGE_DATE} entry"; exit 1; }
npm --prefix "$ext" run lint
git push -u origin HEAD
gh pr create --repo raycast/extensions --base main --web
'''

[commit.generation]
command = "MAX_THINKING_TOKENS=0 claude -p --no-session-persistence --model=haiku --tools='' --disable-slash-commands --setting-sources='' --system-prompt=''"
